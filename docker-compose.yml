services:
  rcaas-ui:
    build:
      context: ./rcaas-ui
    environment:
      SERVICE_URL_RCAAS_UI_8080: /
    depends_on:
      rcaas-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  rcaas-api:
    build:
      context: ./rcaas-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/rcaas
      SPRING_DATASOURCE_USERNAME: ${SERVICE_USER_POSTGRES}
      SPRING_DATASOURCE_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
      OTEL_TRACE_ENABLED: ${OTEL_TRACE_ENABLED:-false}
      OTEL_TRACE_ENDPOINT: ${OTEL_TRACE_ENDPOINT:-}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rcaas
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:

spring:
  application:
    name: Rcaas API
  threads:
    virtual:
      enabled: true
  datasource:
    name: rcaas
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/rcaas}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml
  main:
    lazy-initialization: true
  jmx:
    enabled: false

otel:
  trace:
    enabled: ${OTEL_TRACE_ENABLED:false}
    endpoint: ${OTEL_TRACE_ENDPOINT:}

management:
  tracing:
    sampling:
      probability: 1
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always
